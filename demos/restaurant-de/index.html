<style>
:root{--bg:#F7F1E8;--paper:#FFFBF5;--ink:#2A1C14;--mute:#7A6656;--line:#E7DCCB;--saffron:#D9902B;--olive:#5F6E35;--red:#B4472F;--deep:#24170F}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Readex Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.demo{background:var(--deep);color:#F4EBDD;font-size:13.5px;text-align:center;padding:9px 16px}
.demo a{color:var(--saffron);font-weight:600;margin-inline-start:8px}
header{position:sticky;top:0;z-index:20;background:rgba(247,241,232,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:74px;gap:16px}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none;white-space:nowrap}
.logo b{font-family:Fraunces,serif;font-size:26px;color:var(--red)}
.logo span{font-family:'Aref Ruqaa',serif;font-size:22px;color:var(--olive)}
.links{display:flex;gap:26px;font-size:15px}
.links a{text-decoration:none;color:var(--mute)}
.links a:hover{color:var(--ink)}
.right{display:flex;gap:10px;align-items:center}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.lang button{font-family:inherit;font-size:14px;border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;background:var(--red);color:#fff;text-decoration:none;font-weight:600;font-size:15.5px;border:0;cursor:pointer;font-family:inherit;transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.hero{padding-block:72px 64px}
.hero .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.kicker{display:inline-flex;gap:8px;align-items:center;color:var(--olive);font-weight:500;font-size:15px}
.kicker i{width:22px;height:2px;background:var(--olive)}
h1{font-family:Fraunces,serif;font-size:clamp(44px,6.2vw,84px);line-height:1.05;margin:14px 0 18px;font-weight:700;letter-spacing:-1px}
h1 em{font-style:normal;color:var(--red)}
[dir=rtl] h1{font-family:'Readex Pro',sans-serif;line-height:1.2;letter-spacing:0}
.lead{font-size:18.5px;color:var(--mute);max-width:500px;margin:0 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.plate{position:relative;aspect-ratio:1/1;border-radius:44px;background:linear-gradient(160deg,#EFD9B8,#F7EBD8);overflow:hidden;border:1px solid var(--line)}
.badge{position:absolute;background:var(--paper);border-radius:18px;padding:12px 16px;font-size:14px;box-shadow:0 18px 40px -20px rgba(42,28,20,.5)}
.badge b{display:block;font-size:19px;color:var(--red)}
.b1{bottom:22px;inset-inline-start:22px}
.b2{top:22px;inset-inline-end:22px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-top:56px}
.facts div{background:var(--paper);padding:20px 22px}
.facts b{display:block;font-size:17px}
.facts span{font-size:14px;color:var(--mute)}
section{padding:88px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:30px;flex-wrap:wrap}
h2{font-family:Fraunces,serif;font-size:clamp(32px,4vw,52px);line-height:1.15;margin:0;font-weight:700}
[dir=rtl] h2{font-family:'Readex Pro',sans-serif}
.head p{margin:0;color:var(--mute);max-width:430px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.tab{font-family:inherit;font-size:15px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--mute);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.item{display:grid;grid-template-columns:60px 1fr auto;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}
.item .th{width:60px;height:60px;border-radius:16px;display:grid;place-items:center}
.item h3{margin:0;font-size:17.5px}
.item small{display:block;font-family:'Aref Ruqaa',serif;color:var(--olive);font-size:15px;line-height:1.3}
[dir=rtl] .item small{font-family:Fraunces,serif;font-size:13.5px}
.item p{margin:2px 0 0;color:var(--mute);font-size:14px}
.item .pr{display:grid;justify-items:end;gap:8px}
.item .pr b{font-size:16px;color:var(--red);white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:#E6EDD6;color:var(--olive);margin-inline-start:6px;vertical-align:2px}
.add{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:22px;line-height:1;cursor:pointer;font-family:inherit}
.note{color:var(--mute);font-size:13px;margin-top:16px}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:28px}
.card h3{margin:12px 0 6px;font-size:20px}
.card p{margin:0;color:var(--mute);font-size:15px}
.card .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#F3E3C8}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:30px}
.hours{width:100%;border-collapse:collapse;font-size:15.5px}
.hours td{padding:11px 0;border-bottom:1px dashed var(--line)}
.hours td:last-child{text-align:end;color:var(--mute);direction:ltr}
[dir=rtl] .hours td:last-child{text-align:left}
form{display:grid;gap:12px;margin-top:6px}
label{font-size:14px;font-weight:500;display:grid;gap:6px}
input,select{font-family:inherit;font-size:15.5px;padding:12px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
footer{padding:40px 0 120px;color:var(--mute);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:28px}
.cart{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(140%);visibility:hidden;z-index:30;width:min(560px,calc(100% - 24px));background:var(--deep);color:#fff;border-radius:22px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 24px 50px -16px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility .35s}
.cart.on{transform:translateX(-50%);visibility:visible}
.cart small{display:block;font-size:13px;opacity:.7}
.cart b{font-size:17px}
.cart .btn{background:#25D366;min-height:46px}
.toast{position:fixed;top:90px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--deep);color:#fff;padding:14px 22px;border-radius:14px;font-size:14.5px;opacity:0;pointer-events:none;transition:.3s;z-index:40;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){.links{display:none}.hero .grid,.visit{grid-template-columns:1fr}.menu{grid-template-columns:1fr}.why{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr 1fr}.plate{max-width:440px;width:100%;margin:0 auto}}
@media (max-width:560px){.right .btn{display:none}.logo span{display:none}.logo b{font-size:22px}.why{grid-template-columns:1fr}section{padding:64px 0}.hero{padding-block:40px}.row2{grid-template-columns:1fr}.item{grid-template-columns:50px 1fr auto;gap:12px;padding:12px}.item .th{width:50px;height:50px}}

</head>

var L='de',cur=0,cart={};
try{var s=localStorage.getItem('jh-lang');if(s)L=s}catch(e){}
function fmt(n){return L==='de'?n.toFixed(2).replace('.',',')+' €':n.toFixed(2).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]}).replace('.','٫')+' €'}
function apply(){var t=T[L];document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');if(el.hasAttribute('data-html'))el.innerHTML=t[k];else el.textContent=t[k]});
 document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===L)});
 tabs();list();upd();try{localStorage.setItem('jh-lang',L)}catch(e){}}
function tabs(){var el=document.getElementById('tabs');el.innerHTML='';T[L].cats.forEach(function(c,i){var b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.textContent=c;b.setAttribute('aria-selected',i===cur);b.onclick=function(){cur=i;tabs();list()};el.appendChild(b)})}
function list(){var el=document.getElementById('list');el.innerHTML='';var ar=L==='ar';M[cur].forEach(function(it){var name=ar?it[1]:it[0],other=ar?it[0]:it[1],desc=ar?it[3]:it[2];var d=document.createElement('article');d.className='item';
 d.innerHTML='<div class="th" style="background:'+it[5]+'26"><svg width="32" height="32" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="'+it[5]+'"/><circle cx="20" cy="20" r="8" fill="#fff" opacity=".3"/></svg></div><div><h3>'+name+(it[6]?'<span class="tag">'+T[L].veg+'</span>':'')+'</h3><small>'+other+'</small><p>'+desc+'</p></div><div class="pr"><b>'+fmt(it[4])+'</b><button class="add" aria-label="+ '+name+'">+</button></div>';
 d.querySelector('.add').onclick=function(){var k=it[0];cart[k]=cart[k]||{q:0,p:it[4],ar:it[1]};cart[k].q++;upd()};el.appendChild(d)})}
function upd(){var q=0,s=0;for(var k in cart){q+=cart[k].q;s+=cart[k].q*cart[k].p}document.getElementById('cc').textContent=(L==='ar'?String(q).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]}):q)+' '+T[L].items;document.getElementById('ct').textContent=fmt(s);document.getElementById('cart').classList.toggle('on',q>0)}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},4200)}
document.getElementById('send').onclick=function(){var l=[];for(var k in cart)l.push(cart[k].q+'× '+(L==='ar'?cart[k].ar:k));toast(T[L].toastOrder+' ('+l.join(', ')+').')};
document.getElementById('rf').addEventListener('submit',function(e){e.preventDefault();toast(T[L].toastRes)});
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){L=b.dataset.l;apply()}});
apply();
</script>
