<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shamiat — proposal mock-up by Roaa Ibrahim</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cormorant+Garamond:wght@600;700&family=Readex+Pro:wght@300;400;500;600&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#0E1A16;--paper:#13241E;--card:#172C25;--ink:#F3ECDD;--mute:#A9B5AC;--line:#24413A;--acc:#C9A45C;--acc2:#7FA07B}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Readex Pro','Rubik',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.banner{background:var(--acc);color:var(--bg);font-size:13.5px;text-align:center;padding:9px 16px;font-weight:500}
.banner a{font-weight:700;margin-inline-start:8px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:14px}
.logo{font-family:var(--hf);font-size:30px;text-decoration:none;color:var(--acc);white-space:nowrap;line-height:1}
.links{display:flex;gap:24px;font-size:15px}.links a{text-decoration:none;color:var(--mute)}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px}
.lang button{font-family:inherit;font-size:13.5px;border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--acc);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;background:var(--acc);color:var(--bg);text-decoration:none;font-weight:600;font-size:15.5px;border:0;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.hero{padding-block:76px 60px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.kicker{color:var(--acc2);font-weight:500}
h1{font-family:var(--hf);font-size:clamp(44px,6.4vw,86px);line-height:1.12;margin:10px 0 18px;font-weight:700}
h1 em{font-style:normal;color:var(--acc)}
.lead{font-size:18.5px;color:var(--mute);max-width:520px;margin:0 0 28px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.art{aspect-ratio:1/1;border-radius:40px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--acc) 22%,var(--paper)),var(--paper) 70%);border:1px solid var(--line);display:grid;place-items:center}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-top:54px}
.facts div{background:var(--paper);padding:20px 22px}.facts b{display:block;font-size:17px}.facts span{font-size:14px;color:var(--mute)}
section{padding:84px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px;flex-wrap:wrap}
h2{font-family:var(--hf);font-size:clamp(34px,4.2vw,54px);line-height:1.15;margin:0}
.head p{margin:0;color:var(--mute);max-width:430px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.tab{font-family:inherit;font-size:15px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.item{display:grid;grid-template-columns:60px 1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.th{width:60px;height:60px;border-radius:16px;display:grid;place-items:center}
.item h3{margin:0;font-size:17.5px}.item small{display:block;color:var(--acc2);font-size:13.5px}.item p{margin:2px 0 0;color:var(--mute);font-size:14px}
.add{width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:var(--bg);font-size:22px;cursor:pointer}
.story{background:var(--paper);border:1px solid var(--line);border-radius:32px;padding:44px;font-size:19px;max-width:860px}
.story h2{margin-bottom:12px}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:30px}
.hours td{padding:10px 0;border-bottom:1px dashed var(--line)}.hours{width:100%;border-collapse:collapse}.hours td:last-child{text-align:end;direction:ltr;color:var(--mute)}
[dir=rtl] .hours td:last-child{text-align:left}
form{display:grid;gap:12px}label{display:grid;gap:6px;font-size:14px;font-weight:500}
input,select{font-family:inherit;font-size:15.5px;padding:12px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
footer{padding:40px 0 120px;color:var(--mute);font-size:14px}footer .wrap{border-top:1px solid var(--line);padding-top:26px}
.cart{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(140%);visibility:hidden;z-index:30;width:min(540px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:22px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:transform .35s,visibility .35s}
.cart.on{transform:translateX(-50%);visibility:visible}.cart .btn{background:#25D366;color:#fff;min-height:46px}
.toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:14px;font-size:14.5px;opacity:0;pointer-events:none;transition:.3s;z-index:40;max-width:90vw;text-align:center}.toast.on{opacity:1}
@media(max-width:900px){.links{display:none}.grid,.visit{grid-template-columns:1fr}.menu{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.art{max-width:420px;width:100%;margin:0 auto}}
@media(max-width:560px){.nav .btn{display:none}section{padding:60px 0}.hero{padding-block:40px}.row2{grid-template-columns:1fr}.story{padding:28px;font-size:17px}}
</style></head><body>
